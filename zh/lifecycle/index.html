<script>

(function () {
  var KEY = 'dxbc_lang_banner_dismissed';
  try { if (localStorage.getItem(KEY)) return; } catch (e) {}
  var lang = (navigator.language || 'en').toLowerCase();
  if (lang.indexOf('ru') === 0) return;
  var COPY = {
    en: { txt: 'This page is in Russian.',           cta: 'Open in English →', url: '/en/sales/' },
    ar: { txt: 'هذه الصفحة باللغة الروسية.',           cta: 'افتح بالعربية ←',    url: '/ar/sales/' },
    hi: { txt: 'यह पेज रूसी में है।',                cta: 'हिन्दी में खोलें →',     url: '/hi/sales/' },
    zh: { txt: '此页面为俄语。',                        cta: '切换到中文 →',         url: '/zh/sales/' }
  };
  var c = COPY[lang.slice(0, 2)] || COPY.en;
  var banner = document.getElementById('lang-banner');
  if (!banner) return;
  banner.querySelector('.lb-text').textContent = c.txt;
  var cta = banner.querySelector('.lb-cta');
  cta.textContent = c.cta;
  cta.href = c.url;
  banner.hidden = false;
  document.body.classList.add('has-lang-banner');
  banner.querySelector('.lb-x').addEventListener('click', function () {
    banner.hidden = true;
    document.body.classList.remove('has-lang-banner');
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
  });
})();
</script>
